<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D PLY Viewer</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
        "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.7.3/build/index.module.js"
      }
    }
  </script>
</head>
<body>
  <main id="viewport-container" class="viewport">
    <canvas id="three-canvas"></canvas>

    <!-- 2D Overlay for 3D Measurement Labels -->
    <div id="labels-container" class="labels-layer"></div>

    <!-- Compact Floating Controls Bar -->
    <div class="floating-toolbar">
      <button id="btn-ruler" class="btn btn-tool" title="Toggle 3D Ruler (Shortcut: R)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21.3 15.3a2.4 2.4 0 0 1 0 3.4l-2.6 2.6a2.4 2.4 0 0 1-3.4 0L2.7 8.7a2.41 2.41 0 0 1 0-3.4l2.6-2.6a2.41 2.41 0 0 1 3.4 0Z"/>
          <path d="m14.5 12.5 2-2"/>
          <path d="m11.5 9.5 2-2"/>
          <path d="m8.5 6.5 2-2"/>
          <path d="m17.5 15.5 2-2"/>
        </svg>
        <span>Ruler</span>
      </button>

      <select id="unit-select" class="select-compact" title="Measurement units">
        <option value="cm" selected>cm</option>
        <option value="mm">mm</option>
        <option value="m">m</option>
        <option value="in">in</option>
        <option value="ft">ft</option>
      </select>

      <button id="btn-clear-measurements" class="btn btn-icon" title="Clear measurements (Shortcut: C)" disabled>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
        </svg>
      </button>

      <div class="toolbar-divider"></div>

      <select id="shading-select" class="select-compact" title="Shading mode">
        <option value="unlit" selected>Unlit Color</option>
        <option value="lit">Shaded</option>
        <option value="clay">Clay</option>
        <option value="points">Points</option>
        <option value="wireframe">Wireframe</option>
      </select>

      <button id="btn-reset-view" class="btn btn-icon" title="Reset camera view (Shortcut: F)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 2v3m0 14v3M2 12h3m14 0h3"/>
        </svg>
      </button>

      <button id="btn-fullscreen" class="btn btn-icon" title="Toggle Fullscreen">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
        </svg>
      </button>
    </div>

    <!-- Active Ruler Prompt / Live Measurement Pill -->
    <div id="ruler-hud" class="ruler-hud hidden">
      <div class="ruler-status-row">
        <span class="pulse-dot"></span>
        <span id="ruler-step-text">Click Point A on the model</span>
      </div>
      <div id="ruler-readout" class="ruler-readout hidden">
        <span id="live-distance-val" class="dist-main">—</span>
        <span class="deltas-inline">
          <span class="dx">ΔX <b id="live-dx">—</b></span>
          <span class="dy">ΔY <b id="live-dy">—</b></span>
          <span class="dz">ΔZ <b id="live-dz">—</b></span>
        </span>
      </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay">
      <div class="loader-card">
        <div class="spinner"></div>
        <div id="loading-title" class="loading-title">Loading 3D Scan…</div>
        <div id="loading-status" class="loading-status">Streaming binary PLY…</div>
        <div class="progress-track">
          <div id="loading-bar" class="progress-fill" style="width: 0%"></div>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
